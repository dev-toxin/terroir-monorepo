services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: terroir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terroir}
      POSTGRES_USER: ${POSTGRES_USER:-terroir_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terroir_app} -d ${POSTGRES_DB:-terroir}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: terroir-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      BACKEND_HTTP_ADDR: ":8080"
      STORAGE: postgres
      AUTO_SEED: ${AUTO_SEED:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-terroir_app}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres:5432/${POSTGRES_DB:-terroir}?sslmode=disable
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-Bearer}
      LLM_EXTRA_HEADERS: ${LLM_EXTRA_HEADERS:-}
      LLM_MONTHLY_BUDGET: ${LLM_MONTHLY_BUDGET:-0}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
